name: Build ARM64 Driver

on:
  push:
    branches: [ "bsd" ]
  pull_request:
    branches: [ "bsd" ]

env:
  PROJECT_FILE_PATH: if_re.vcxproj
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: ARM64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Install WDK
      run: |
        choco install windows-driver-kit -y
      # Or download and install a specific version:
      #   Use Microsoft's official WDK installer with silent flags if needed

    - name: Build ARM64 Driver
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{env.BUILD_PLATFORM}} ${{env.PROJECT_FILE_PATH}}
